<svg xmlns="http://www.w3.org/2000/svg" width="200" height="20" role="img" aria-label="Screenshots">
<title>Screenshots</title>
<linearGradient id="s" x2="0" y2="100%">
<stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
<stop offset="1" stop-opacity=".1"/>
</linearGradient>
<clipPath id="r"><rect width="200" height="20" rx="3" fill="#fff"/></clipPath>
<g clip-path="url(#r)">
<rect width="200" height="20" fill="#555555"/>
<rect width="200" height="20" fill="url(#s)"/>
</g>
<g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">
<text x="100" y="15" fill="#010101" fill-opacity=".3" textLength="180" lengthAdjust="spacingAndGlyphs">首页 · 媒体库 · 详情页 · 播放页</text>
<text x="100" y="14" textLength="180" lengthAdjust="spacingAndGlyphs">首页 · 媒体库 · 详情页 · 播放页</text>
</g>
</svg>
