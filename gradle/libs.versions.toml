[versions]
agp = "9.4.0"
commonsNet = "3.13.0"
smbj = "0.14.0"
kotlin = "2.3.20"
composeBom = "2026.03.00"
# Haze：Compose 里唯一成熟的「背景模糊（backdrop blur）」实现。
# Cine 新界面的玻璃 Dock / 顶栏 / 长按菜单全靠它 —— Compose 官方只有
# `Modifier.blur()`（模糊自己），没有 CSS 的 `backdrop-filter`。
# ⚠️ 只被 ui/cine/** 使用，Classic 界面完全不经过它（红线：新 UI 不影响老 UI）。
# 停在 1.7.3：2.x 把 API 重写成 HazeEffectFactory/HazeInput 那套，
# 调用方要自己实现渲染器，成本远超收益。
haze = "1.7.3"
activityCompose = "1.13.0"
koin = "4.2.0"
lazycolumnscrollbar = "2.2.0"
nanohttpd = "2.3.1"
room = "2.8.4"
navigation3 = "1.0.1"
kotlinx-serialization = "1.10.0"
accompanist = "0.37.3"
okhttp = "5.3.2"
sardineAndroid = "0.8"
reorderable = "3.0.0"
aboutLibraries = "15.1.1"
mpv-android = "1.0.0"
mediainfo-android = "1.0.2"
# Media3（ExoPlayer）—— 双播放内核里的第二个内核
gsy = "13.2.1"
# Media3 / ExoPlayer 的版本：**必须与 gsy-exo2 传递进来的版本一致**。
# gsy-exo2 会带 media3 全家桶进来；这里显式声明只是为了不再依赖它的传递，
# 版本号一旦和它对不上，classpath 上会出现两份 media3，运行时随机炸
# （典型症状：NoSuchMethodError / duplicate class）。
media3 = "1.10.1"
# 测试（清单 1.2：此前项目零测试，Room 迁移链完全裸奔）
junit = "4.13.2"
robolectric = "4.16"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
coroutinesTest = "1.11.0"
mockk = "1.14.6"
truth = "1.4.5"
# 弹幕渲染：DanmakuFlameMaster 已改为**源码内置**（v115）——
# 源码在 app/src/main/java/master/flame/danmaku/（+ tv/cjump/jni/），
# 因为要修引擎自身的「滚动速度与存活寿命同源」缺陷（见 2026-10-19.md v115 段）。
# 原先的 AAR 坐标 `com.github.ctiao:dfm:0.9.25` 已移除。
# Lottie（airbnb）：加载动画用。6.x 需要 compileSdk 34+ / minSdk 21+，本项目 37 / 26 都满足。
lottie = "6.7.1"
# Telephoto（saket）：Compose 图片缩放/平移手势（照片浏览器用）。
# 只取核心 `zoomable` 模块（`Modifier.zoomable`）—— 项目的图片加载走自研
# EmbyImageLoader（OkHttp + BitmapFactory），**不是** Coil/Glide，
# 所以 zoomable-image/coil、zoomable-image/glide 那几个集成模块一概不需要。
telephoto = "0.19.0"
# Coil 3（coil-kt）：照片浏览器 / 照片网格的**图片渲染层**。
# 项目其余封面（海报、横幅、宫格）仍走自研 EmbyImageLoader —— 只有照片链路换它，
# 换的是「成熟框架才有的东西」：按显示尺寸采样（自适应，不整张原图进内存）、
# 内存/磁盘双层缓存按字节上限自动淘汰、crossfade、请求自动取消。
# ⚠️ 只取 coil-compose 一个 artifact：core 由它传递进来，网络走项目自己的 Fetcher
#    （EmbyPhotoFetcher → EmbyImageLoader.downloadBytes），不需要官方的 okhttp 模块。
#    没引 coil-gif / coil-svg / coil-video —— 项目用不到，多引只增体积。
coil = "3.6.3"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
commons-net = { module = "commons-net:commons-net", version.ref = "commonsNet" }
smbj = { module = "com.hierynomus:smbj", version.ref = "smbj" }
lazycolumnscrollbar = { module = "com.github.nanihadesuka:LazyColumnScrollbar", version.ref = "lazycolumnscrollbar" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
sardine-android = { module = "com.github.thegrizzlylabs:sardine-android", version.ref = "sardineAndroid" }
saveable = { group = "androidx.compose.runtime", name = "runtime-saveable", version = "1.10.5" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3-android = { group = "androidx.compose.material3", name = "material3", version = "1.5.0-alpha15" }
androidx-compose-material = { group = "androidx.compose.material", name = "material" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.1" }
androidx-material3-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version = "1.7.8" }
androidx-compose-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version = "1.1.1" }
androidx-compose-animation-graphics = { group = "androidx.compose.animation", name = "animation-graphics-android" }
# 背景模糊（玻璃层）。见 [versions].haze 的说明。
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
mediasession = { group = "androidx.media", name = "media", version = "1.7.1" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.1.0" }
seeker = "com.github.abdallahmehiz:seeker:2.0.1"
mediainfo-lib = { module = "io.github.marlboro-advance:mediainfo-android", version.ref = "mediainfo-android" }
mpv-android = { module = "io.github.marlboro-advance:mpv-android", version.ref = "mpv-android" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }

compose-prefs = { module = "me.zhanghai.compose.preference:preference", version = "2.2.0" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }


kotlinx-immutable-collections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version = "0.4.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

truetype-parser = { module = "io.github.yubyf:truetypeparser-light", version = "2.1.4" }
fsaf = { module = "com.github.K1rakishou:Fuck-Storage-Access-Framework", version = "1.1.3" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutLibraries" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

# Media3 / ExoPlayer（第二播放内核）
# GSYVideoPlayer：java（含全部播放器 View + IJK Java 绑定）
gsy-java = { module = "io.github.carguo:gsyvideoplayer-java", version.ref = "gsy" }
# GSY 的 ExoPlayer（media3）内核
gsy-exo2 = { module = "io.github.carguo:gsyvideoplayer-exo2", version.ref = "gsy" }
# IJK 原生库（按 ABI 拆）：缺了它们 IJK 内核直接起不来
gsy-arm64 = { module = "io.github.carguo:gsyvideoplayer-arm64", version.ref = "gsy" }
gsy-armv7a = { module = "io.github.carguo:gsyvideoplayer-armv7a", version.ref = "gsy" }
gsy-x86 = { module = "io.github.carguo:gsyvideoplayer-x86", version.ref = "gsy" }
gsy-x64 = { module = "io.github.carguo:gsyvideoplayer-x64", version.ref = "gsy" }

# 视界流（仿抖音竖屏连播）直接用的 ExoPlayer —— 不经过 GSY 那层。
# 为什么绕开 GSY：GSYVideoManager 是进程级静态单例，多个 GSYVideoPlayer 也只能
# 共用同一个底层 player，做不到「相邻页各持一个实例、提前缓冲」。
# ExoPlayer.Builder(context).build() 每次都是独立实例，这才是无感滑动的前提。
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
# PlayerView（画面 + 可选自带控件）；`use_controller=false` 即可完全没有自带控件
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# VerticalPager 所在的包；版本由 compose-bom 统一管理，所以这里不带 version
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# ── 测试（清单 1.2）──
# 选型说明：
#   - 纯逻辑（分页状态机、错误分类、筛选正则、排序）走 **JVM 单测**，
#     靠 Robolectric 提供 Android 运行时（Log / Context 那些），秒级出结果。
#   - Room 迁移测试走 **instrumentation test**（MigrationTestHelper 需要真 SQLite），
#     只能 `connectedAndroidTest`，本机没设备时用 `-PskipDeviceTests` 跳过。
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
# Room 迁移测试用：MigrationTestHelper 本身在 room-testing 里
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# ── 弹幕 ──
# 弹幕渲染引擎（DanmakuFlameMaster）为源码内置：app/src/main/java/master/flame/danmaku/。
# 只用它的 View + 数据模型，解析走我们自己的 parser（dandanplay 的 p 字段 csv，不是 B 站 XML）。

# ── Lottie 加载动画 ──
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }

# ── Coil 3：照片链路的图片渲染层（见 versions 里的说明）──
# 只要 coil-compose（core 由它传递进来）。网络**不用**官方的 coil-network-okhttp：
# 照片的字节走项目自己的 EmbyImageLoader（见 EmbyPhotoFetcher），
# 官方那套不知道 Emby 鉴权，也不该和自研 Fetcher 抢请求。
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# 视频首帧解码（上传选择器的相册网格要显示视频缩略图）。
# 只有 `VideoFrameDecoder` 一个类有用，它底层是 MediaMetadataRetriever，无额外传递依赖。
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }

# ── Telephoto：照片浏览器的缩放/平移手势 ──
# Android artifact 带 `-android` 后缀（telephoto 是 KMP 项目，-android 是它的 Android 发布变体）。
telephoto-zoomable = { module = "me.saket.telephoto:zoomable-android", version.ref = "telephoto" }

[bundles]
koin = ["koin-core", "koin-android", "koin-compose", "koin-viewmodel"]
compose-navigation3 = ["androidx-navigation3-runtime", "androidx-navigation3-ui"]

[plugins]
ksp = { id = "com.google.devtools.ksp", version = "2.3.6" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
