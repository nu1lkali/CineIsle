# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 2G 不够：本项目 jniLibs 带 4 个 ABI 共 151MB 的 mpv/ffmpeg 原生库，
# dex 阶段（dexBuilderStandardDebug）会在 2G 堆下直接失败且不给出明确原因。
# 提到 4G 后 dex 正常通过；Metaspace 也一并放宽，避免大量 Compose 类触发元空间扩容。
# 4G → 5G：R8（release）、Dexer、Kotlin 编译都在 Gradle 守护进程里跑，
# 本机 16GB，留 5G 给 Gradle + 2G 给 Kotlin 守护进程仍有富余。
# 5G → 6G：R8（占 release 构建 6m31s）跑在 Gradle 守护进程里，堆越大越少触发
# GC 抖动；本机 16GB，6G(Gradle) + 2G(Kotlin 守护进程) + 系统仍有余量。
# 并行 GC 是 R8 这类「大堆 + 单线程长任务」场景最稳的选择。
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# 常驻守护进程（最关键的一条）：配合去掉命令行里的 --no-daemon，
# 第二次构建直接复用已加载的类、依赖缓存与 Kotlin 编译守护进程，
# 冷启动那 1~2 分钟的配置 + 预热时间全省掉。
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# ⚠️⚠️ v118：并发工作线程数 —— 这条是「编译越来越慢」的直接原因之一。
#   本机 6 核 12 线程 / 16GB，之前命令行一直传 `--max-workers=2`，
#   等于把 6 核的机器当 2 核用：Kotlin 编译、Dex、资源合并全被压成两路，
#   明明有 6G 堆却让 4 个核干等着。
#   取 6 = 物理核数（不取 12：超线程在编译这种密集整数活上收益很有限，
#   却会让 6G 堆同时塞进两倍的 dex 缓冲，容易触发 GC 抖动）。
# ⚠️ 命令行里的 --max-workers 会**覆盖**这里，所以构建命令一律不要再传这个参数。
org.gradle.workers.max=6
# 本地构建缓存：切分支来回改、或者 revert 之后重新编译，能直接命中之前的产物
org.gradle.caching=true
# 配置缓存：第二次构建跳过整个 configuration 阶段（本项目配置期要解析版本目录、
# 读 git 提交号、展开 4 个 productFlavor × 3 个 buildType，实测这块很耗时）
org.gradle.configuration-cache=true
# ⚠️ 配置缓存**遇到不兼容就整构建失败**，还只给一句「problem」让人自己去翻报告。
#   降级成 warn：真碰到不兼容的插件/任务时，它自己退回普通配置继续把包出出来，
#   同时在输出里警告，不至于把一次构建直接干掉（改动配置期逻辑时尤其有用）。
org.gradle.unsafe.configuration-cache-problems=warn
# 文件系统监听：增量编译不用每次全量扫目录
org.gradle.vfs.watch=true
# Kotlin 编译守护进程的堆，避免它和 Gradle 抢内存被系统回收
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true